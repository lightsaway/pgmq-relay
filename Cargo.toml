[package]
name = "pgmq-relay"
version = "0.2.4"
edition = "2021"
rust-version = "1.96"
authors = ["PGMQ Relay Maintainers"]
description = "A message relay service that forwards PGMQ messages to various message brokers"
keywords = ["messaging", "queues", "postgres", "relay", "kafka"]
license = "PostgreSQL"
repository = "https://github.com/lightsaway/pgmq-relay"

[lib]
name = "pgmq_relay"
path = "src/lib.rs"

[features]
default = []
# Enable verbose debug logging (normally disabled for performance)
verbose-logging = []
# Enable per-message trace logging (very expensive, debug only)
trace-messages = []
# Enable hot-path trace logging (extremely expensive, debug only)
trace-hot-paths = []

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
humantime-serde = "1.1"

# Message broker integrations
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored"] }
lapin = "4.10"
async-nats = "0.49"

# Error handling and logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

# Circuit breaker and error recovery
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
tower-resilience-circuitbreaker = "0.13"

# Metrics and monitoring
prometheus = "0.14"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
hyper = "1.0"

[dev-dependencies]
tempfile = "3.8"
test-log = "0.2"
